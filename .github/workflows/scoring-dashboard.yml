# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_run:
    workflows: ["glm_aed_flare_automation_test"]
    types: [completed]
  workflow_dispatch:

name: scoring-dashboard

jobs:
  scoring:
    runs-on: ubuntu-latest #[self-hosted]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MW_ACCESS_KEY_ID: ${{ secrets.MW_ACCESS_KEY_ID }}
      MW_ACCESS_SECRET: ${{ secrets.MW_ACCESS_SECRET }}
    permissions:
     contents: write
    container: rqthomas/flare-rocker:4.4
    steps:
      - uses: actions/checkout@v6

      - name: clone lake repository
        uses: actions/checkout@v6
        with:
          repository: ecoforecastVT/YARR-forecast
          token: ${{ secrets.GIT_PAT }}
          path: forecast-code

      - name: install deps
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        shell: Rscript {0}
        run: |
          remotes::install_github('LTREB-reservoirs/ver4castHelpers')
          install.packages('rLakeAnalyzer')
          install.packages('minioclient')
          install.packages('duckdbfs')
          install.packages('tidyverse')
          remotes::install_cran("dplyr", force = TRUE)

      - name: scoring
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MW_ACCESS_SECRET }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript $GITHUB_WORKSPACE/forecast-code/scoring/scoring.R

      - name: Call Healthcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -m 10 --retry 5 https://hc-ping.com/06e8b152-229a-43d6-8bea-21958e6f359f


  build-deploy-dashboard:
    runs-on: ubuntu-latest
    needs: scoring
    if: always()
    permissions:
     contents: write
    container: rqthomas/vera-rocker:latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MW_ACCESS_KEY_ID: ${{ secrets.MW_ACCESS_KEY_ID }}
      MW_ACCESS_SECRET: ${{ secrets.MW_ACCESS_SECRET }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: clone lake repository
        uses: actions/checkout@v6
        with:
          repository: ecoforecastVT/YARR-forecast
          token: ${{ secrets.GIT_PAT }}
          path: forecast-code

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' ### this might need to be upgraded (v26) after 9/16/26

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c(
            "tidyverse", "arrow", "bslib", "bsicons",
            "leaflet", "oce", "glue", "sf", "jpeg", "lubridate", "curl", "minioclient",
            "downloadthis", "staticryptR"
          ))
          install.packages("remotes")
          #remotes::install_github("eco4cast/minioclient")
          install.packages("staticryptR", repos = c(
            "https://zajichek.r-universe.dev",
            "https://cloud.r-project.org"
          ))

      #- name: Install MinIO client (mc)
      #  run: |
      #    curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
      #    chmod +x /usr/local/bin/mc
      #    mc --version

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2


      - name: Render and encrypt dashboard
        working-directory: forecast-code/dashboard
        shell: bash
        run: |

          mkdir -p ./encrypted

          # Render directly to a deterministic file
          quarto render index.qmd

          # Verify rendered HTML exists and is non-empty
          if [[ ! -s "./_output/index.html" ]]; then
            echo "ERROR: index.html was not generated or is empty"
            exit 1
          fi

          # Encrypt output
          npx --yes staticrypt ./_output/index.html \
            -p "${DASHBOARD_PASSWORD}" \
            -o ../encrypted/index.html

          # Verify encrypted output exists and is non-empty
          if [[ ! -s "./encrypted/index.html" ]]; then
            echo "ERROR: encrypted/index.html missing or empty"
            exit 1

          fi

          echo "Dashboard render + encryption succeeded"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: forecast-code/dashboard/encrypted
          publish_branch: gh-pages

      - name: Call Healthcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -m 10 --retry 5 https://hc-ping.com/a9b24980-a616-44c0-95b2-a8e93047ec28

